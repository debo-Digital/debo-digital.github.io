<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>debo Digital</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    background-color: #ffffff;
    color: #1c1c1c;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }

  h1 {
    font-size: 3rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    margin: 0;
    cursor: default;
  }

  footer {
    background-color: #f2f2f2;
    color: #1c1c1c;
    text-align: center;
    padding: 0.5rem;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.03em;
  }

  footer p {
    margin: 0;
  }
</style>
</head>
<body>

<main>
  <h1 id="brand">debo Digital</h1>
</main>

<footer>
  <p>&copy; <span id="year"></span> debo Digital. All rights reserved.</p>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  (function () {
    var brand = document.getElementById('brand');
    var original = brand.textContent;
    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789*$@^#';
    var intervalId = null;

    function randomChar() {
      return chars[Math.floor(Math.random() * chars.length)];
    }

    function scramble() {
      brand.textContent = original
        .split('')
        .map(function (ch) {
          return ch === ' ' ? ' ' : randomChar();
        })
        .join('');
    }

    brand.addEventListener('mouseenter', function () {
      if (intervalId) return;
      intervalId = setInterval(scramble, 50);
    });

    brand.addEventListener('mouseleave', function () {
      clearInterval(intervalId);
      intervalId = null;
      brand.textContent = original;
    });
  })();
</script>

</body>
</html>
